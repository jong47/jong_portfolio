[project]
name = "portfolio-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jonathan Grady Ong", email = "gradyjonathan55@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.72",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
serve = "portfolio_api.main:serve"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
