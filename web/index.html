<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <title>Jonathan Ong — AI / Backend Engineer</title>
        <meta
            name="description"
            content="Jonathan Ong — AI and backend engineer building event-driven Azure systems, LLM gateways, and high-volume document processing pipelines."
        />
        <meta name="theme-color" content="#fbfbfa" />

        <meta property="og:type" content="website" />
        <meta property="og:title" content="Jonathan Ong — AI / Backend Engineer" />
        <meta
            property="og:description"
            content="AI and backend engineer building event-driven Azure systems, LLM gateways, and high-volume document processing pipelines."
        />

        <!-- Runs before first paint to avoid a flash. Mirrors src/lib/theme.ts. -->
        <script>
            ;(function () {
                try {
                    var stored = localStorage.getItem('theme')
                    var dark =
                        stored === 'dark' ||
                        (stored !== 'light' &&
                            window.matchMedia('(prefers-color-scheme: dark)').matches)
                    if (dark) {
                        document.documentElement.classList.add('dark')
                        document
                            .querySelector('meta[name="theme-color"]')
                            .setAttribute('content', '#0c0c0b')
                    }
                } catch (e) {}
            })()
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
