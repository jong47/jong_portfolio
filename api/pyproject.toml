[project]
name = "portfolio-api"
version = "0.1.0"
description = "Contact-form backend for the portfolio site"
readme = "README.md"
authors = [{ name = "Jonathan Grady Ong" }]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.72",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "uvicorn>=0.52.3",
]

[project.scripts]
serve = "portfolio_api.app:serve"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
